<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="clTile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a3bb0"/>
      <stop offset="1" stop-color="#0d1a4d"/>
    </linearGradient>
    <linearGradient id="clOrange" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#f05a00"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#clTile)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- C arc (the "core" ring) -->
  <path d="M44 17 A15.5 15.5 0 1 0 44 47"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- core node -->
  <circle cx="31.5" cy="32" r="6" fill="url(#clOrange)"/>
  <circle cx="31.5" cy="32" r="6" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.4"/>

  <!-- link bar bridging ring to node -->
  <path d="M44 28 L44 36" stroke="#ff8a3d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M41 32 L47 32" stroke="#ff8a3d" stroke-width="4.5" stroke-linecap="round"/>
</svg>
